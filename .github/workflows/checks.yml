name: CPU checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OMP_NUM_THREADS: "2"
      MKL_NUM_THREADS: "2"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install CPU dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt
      - name: Run existing tests
        run: python -m unittest discover -s tests -v
      - name: Validate release contents
        run: python tools/validate_release.py
      - name: Exercise the documented CPU example
        run: |
          python infer.py --algorithm cbm3d --image examples/noisy.png --output outputs/cbm3d.png --json outputs/cbm3d.json
          python infer.py --algorithm diffpir --image examples/noisy.png
